  </g>
  <g class="moving-box" stroke="#344b55" stroke-width="3" stroke-linejoin="round">
    <path d="M405 177h49v42h-49z" fill="#d9aa72"/>
    <path d="M405 188h49m-25-11v11m-24 0 24 31 25-31" fill="none"/>
