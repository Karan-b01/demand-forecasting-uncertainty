    <path d="M682 188h74l39 43v36H682z" fill="#d99059" stroke="#344b55" stroke-width="5" stroke-linejoin="round"/>
    <path d="M720 196h31l25 28h-56z" fill="#dce9e5" stroke="#344b55" stroke-width="4"/>
    <path d="M494 267h301" stroke="#344b55" stroke-width="7"/>
